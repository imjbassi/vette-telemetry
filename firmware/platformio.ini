; Corvette telemetry firmware
; atoms3       : M5Stack AtomS3 Lite prototype. BLE + OBD + flash buffer, optional WiFi upload.
; atoms3-bench : the same board on the desk with no car, no adapter and no network. A scripted
;                adapter and a scripted network (src/bench_*.cpp) drive the real gate, queue
;                and upload code. Nothing is sent anywhere.
; sim7670g     : Waveshare ESP32-S3-SIM7670G-4G final device. BLE + OBD + flash + LTE/GNSS.
; Host tests (no board): node test/run-host-tests.mjs

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
; test/host holds PC programs for run-host-tests.mjs, not PlatformIO unit tests.
test_ignore = host
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

[env:atoms3]
board = m5stack-atoms3
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHAS_MODEM=0
    -DHAS_WIFI=1

[env:atoms3-bench]
board = m5stack-atoms3
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHAS_MODEM=0
    -DHAS_WIFI=0
    -DBENCH=1

[env:sim7670g]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    ; Logs go out UART0 through the onboard CH343. If the serial monitor is silent,
    ; flip this to 1 and use the native USB port instead.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DHAS_MODEM=1
    -DHAS_WIFI=0
